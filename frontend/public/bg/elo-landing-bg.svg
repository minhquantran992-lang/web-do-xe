<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081126"/>
      <stop offset="0.52" stop-color="#071225"/>
      <stop offset="1" stop-color="#050914"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="25%" r="60%">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="45%" r="55%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.24"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="60%" cy="92%" r="65%">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.16"/>
      <stop offset="0.65" stop-color="#60A5FA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" fill="url(#glow3)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <g opacity="0.9">
    <path d="M-40 190 C 320 80, 640 60, 980 130 C 1320 200, 1620 210, 1980 120" fill="none" stroke="url(#line)" stroke-width="2"/>
    <path d="M-80 260 C 260 150, 590 130, 930 200 C 1270 270, 1600 290, 2020 210" fill="none" stroke="url(#line)" stroke-width="2" opacity="0.65"/>
    <path d="M-120 860 C 260 740, 620 730, 980 800 C 1340 870, 1640 890, 2060 800" fill="none" stroke="url(#line)" stroke-width="2" opacity="0.55"/>
  </g>

  <g filter="url(#softBlur)" opacity="0.6">
    <circle cx="320" cy="210" r="140" fill="#38BDF8" fill-opacity="0.22"/>
    <circle cx="1540" cy="480" r="160" fill="#22D3EE" fill-opacity="0.18"/>
    <circle cx="980" cy="980" r="220" fill="#60A5FA" fill-opacity="0.12"/>
  </g>

  <rect width="1920" height="1080" fill="url(#bg)" opacity="0.18"/>
